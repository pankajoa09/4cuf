let filter='all';
const typeLabel={meet:'มีตติ้ง',track:'สนามแข่ง',show:'งานแสดงรถ',cruise:'ขับรถเที่ยว'};
const esc=s=>{const d=document.createElement('div');d.textContent=s;return d.innerHTML};
const fmt=d=>new Intl.DateTimeFormat('th-TH',{day:'numeric',month:'short',year:'numeric',timeZone:'Asia/Bangkok'}).format(new Date(d+'T00:00:00+07:00'));
function thaiToday(){const now=new Date();const thai=new Date(now.getTime()+(now.getTimezoneOffset()+420)*60000);return thai.toISOString().slice(0,10)}
function daysUntil(date){return Math.round((new Date(date+'T00:00:00+07:00')-new Date(thaiToday()+'T00:00:00+07:00'))/86400000)}
function countdown(date){const n=daysUntil(date);if(n<0)return'';if(n===0)return'<span class="soon">วันนี้</span>';if(n===1)return'<span class="soon">พรุ่งนี้</span>';if(n<=7)return`<span class="soon">อีก ${n} วัน</span>`;return''}
function card(e){return `<article class="card" data-t="${e.type}"><div class="card-head"><a class="title" href="/th/events/${encodeURIComponent(e.id)}/">${esc(e.name)}</a><span class="tag">${typeLabel[e.type]}</span></div><div class="meta"><span>📅 ${fmt(e.date)}</span><a class="loc" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(e.loc)}" target="_blank" rel="noopener">📍 ${esc(e.loc)}</a>${countdown(e.date)}</div><p class="desc">${esc(e.desc)}</p></article>`}
function render(){const q=document.querySelector('.search').value.trim().toLowerCase();const today=thaiToday();const match=e=>(filter==='all'||e.type===filter)&&(!q||`${e.name} ${e.loc} ${e.desc}`.toLowerCase().includes(q));const visible=EVENTS.filter(e=>e.status!=='cancelled');const upcoming=visible.filter(e=>e.date>=today&&match(e)).sort((a,b)=>a.date.localeCompare(b.date));const past=visible.filter(e=>e.date<today&&match(e)).sort((a,b)=>b.date.localeCompare(a.date));document.getElementById('count').textContent=`พบกิจกรรมที่กำลังจะมาถึง ${upcoming.length} รายการ`;document.getElementById('grid').innerHTML=upcoming.length?upcoming.map(card).join(''):'<div class="empty">ไม่พบกิจกรรมที่ตรงกับการค้นหา</div>';document.getElementById('past').innerHTML=past.map(card).join('');document.getElementById('past-title').classList.toggle('hidden',!past.length)}
function setFilter(button){document.querySelectorAll('.filter').forEach(item=>item.classList.remove('active'));button.classList.add('active');filter=button.dataset.t;render()}
async function loadEvents(){try{const [eventsResponse,translationsResponse]=await Promise.all([fetch('/data/events.json',{cache:'no-store'}),fetch('/data/events-th.json',{cache:'no-store'})]);if(!eventsResponse.ok||!translationsResponse.ok)throw new Error('โหลดข้อมูลไม่สำเร็จ');const data=await eventsResponse.json();const thai=await translationsResponse.json();const translations=new Map(thai.translations.map(item=>[item.id,item]));EVENTS=data.events.map(event=>({...event,...translations.get(event.id)}));document.getElementById('updated').textContent=fmt(data.updated_at)}catch(error){console.error('ใช้ข้อมูลสำรองภาษาไทย:',error);document.getElementById('updated').textContent=fmt('2026-09-01')}render()}
loadEvents();
